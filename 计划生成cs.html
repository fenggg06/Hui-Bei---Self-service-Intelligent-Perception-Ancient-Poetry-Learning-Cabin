<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慧背 - 学习计划</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink-black: #0A0A0A;
            --rice-paper: #FFF5E6;
            --vermilion: #CB3B2F;
            --celadon: #B8D8D8;
            --gold-leaf: #D4AF37;
            --moon-white: #F0F0F0;
            --bamboo-green: #3A5F0B;
            --mercedes-blue: #0066B2;
            --blue-archive-pink: #FF66CC;
            --apple-white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body {
            background: var(--rice-paper);
            color: var(--ink-black);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z" fill="%230066b2" fill-opacity="0.05" fill-rule="evenodd"/></svg>');
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 6%;
        }

        .header {
            position: relative;
            padding: 4rem 0;
            margin-bottom: 3rem;
            text-align: center;
            background: linear-gradient(135deg, rgba(0, 102, 178, 0.08) 0%, rgba(255, 102, 204, 0.05) 100%);
            border-radius: 16px;
            overflow: hidden;
        }

        .header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: -1;
        }

        .title-wrapper {
            position: relative;
            display: inline-block;
            padding: 0 2rem;
        }

        .title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 3rem;
            color: var(--mercedes-blue);
            margin-bottom: 1rem;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--ink-black);
            opacity: 0.8;
        }

        .card {
            background: var(--rice-paper);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05), inset 0 -2px 12px rgba(0, 0, 0, 0.03);
            margin-bottom: 2.5rem;
            overflow: visible;
            z-index: 1;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 80px;
            height: 80px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="%230066b2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>') no-repeat;
            opacity: 0.1;
            transition: all 0.5s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 36px rgba(203, 59, 47, 0.1);
        }

        .card-title {
            font-size: 1.5rem;
            color: var(--vermilion);
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--celadon);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.75rem;
            font-weight: bold;
            color: var(--ink-black);
        }

        .form-control {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid var(--celadon);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--mercedes-blue);
            box-shadow: 0 0 0 3px rgba(0, 102, 178, 0.1);
        }

        .time-slots {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .time-slot {
            flex: 1;
            min-width: 280px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            padding: 1rem;
            border: 1px dashed var(--celadon);
        }

        /* 搜索容器样式 - 浏览器式搜索框增强 */
        .search-container {
            position: relative;
            width: 100%;
            z-index: 1000;
        }

        .search-results {
            position: absolute;
            top: 100%;
            margin-top: 2px;
            left: 0;
            right: 0;
            background: var(--apple-white);
            border: 1px solid var(--celadon);
            border-top: none;
            max-height: 300px;
            overflow-y: auto;
            z-index: 9999;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            display: none; /* 默认隐藏 */
        }

        /* 搜索结果项样式 */
        .search-results .result-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--moon-white);
        }

        /* 鼠标悬停 + 键盘选中样式 */
        .search-results .result-item:hover,
        .search-results .result-item.active {
            background-color: rgba(0, 102, 178, 0.05);
        }

        /* 最后一项去掉下边框 */
        .search-results .result-item:last-child {
            border-bottom: none;
        }

        /* 关键字高亮样式 */
        .search-results .highlight {
            color: var(--vermilion);
            font-weight: bold;
        }

        /* 深色模式适配 */
        [data-theme="dark"] .search-results {
            background: #2D2D2D;
            border-color: #444;
        }

        [data-theme="dark"] .search-results .result-item {
            border-bottom: 1px solid #3A3A3A;
        }

        [data-theme="dark"] .search-results .result-item:hover,
        [data-theme="dark"] .search-results .result-item.active {
            background-color: rgba(0, 136, 255, 0.1);
        }

        [data-theme="dark"] .search-results .highlight {
            color: #FF88FF;
        }

        /* 返回主页按钮样式 */
        .back-home-button {
            position: fixed;
            top: 2rem;
            left: 2rem;
            width: 56px;
            height: 56px;
            background: var(--rice-paper);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            color: var(--ink-black);
            text-decoration: none;
            z-index: 999;
        }

        .back-home-button:hover {
            transform: scale(1.05);
            background: var(--moon-white);
            box-shadow: 0 0 32px rgba(0, 102, 178, 0.3);
        }

        @media (max-width: 768px) {
            .back-home-button {
                width: 48px;
                height: 48px;
                top: 1rem;
                left: 1rem;
            }
        }

        .day-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .day-option {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: var(--moon-white);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .day-option.selected {
            background: var(--mercedes-blue);
            color: white;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--vermilion);
            color: white;
        }

        .btn-primary:hover {
            background: #B83227;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(203, 59, 47, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--mercedes-blue);
            color: var(--mercedes-blue);
        }

        .btn-outline:hover {
            background: var(--mercedes-blue);
            color: white;
        }

        .plan-result {
            display: none;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        .plan-stage {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--gold-leaf);
        }

        .plan-stage h4 {
            color: var(--bamboo-green);
            margin-bottom: 0.5rem;
        }

        .plan-meta {
            font-size: 0.9rem;
            color: var(--ink-black);
            opacity: 0.7;
            margin-bottom: 0.5rem;
        }

        .plan-task {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .poem-preview {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
            line-height: 2;
            text-align: center;
            font-family: 'Noto Serif SC', serif;
        }

        .difficulty-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-left: 0.5rem;
        }

        .difficulty-easy {
            background: rgba(58, 95, 11, 0.1);
            color: var(--bamboo-green);
        }

        .difficulty-medium {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-leaf);
        }

        .difficulty-hard {
            background: rgba(203, 59, 47, 0.1);
            color: var(--vermilion);
        }

        .right-controls {
            position: fixed;
            top: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 999;
        }

        .control-item {
            width: 56px;
            height: 56px;
            background: var(--rice-paper);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .control-item:hover {
            transform: scale(1.05);
            background: var(--moon-white);
        }

        .theme-toggle:hover {
            box-shadow: 0 0 32px rgba(0, 102, 178, 0.3);
        }

        .font-controls {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .font-button {
            width: 56px;
            height: 56px;
            background: var(--rice-paper);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .font-button:hover {
            transform: scale(1.05);
            background: var(--moon-white);
        }

        .floating-ink {
            position: fixed;
            pointer-events: none;
            z-index: -1;
            opacity: 0.1;
            animation: floatFloatingInk 8s ease-in-out infinite;
            font-family: 'Ma Shan Zheng', cursive;
        }

        @keyframes floatFloatingInk {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(10deg); }
        }

        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 102, 178, 0.1);
            border-left-color: var(--mercedes-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        [data-theme="dark"] body {
            --ink-black: #E8E6E3;
            --rice-paper: #1A1A1A;
            --moon-white: #2D2D2D;
            --celadon: #3A5F5F;
            --mercedes-blue: #0088FF;
            --blue-archive-pink: #FF88FF;
            --apple-white: #2D2D2D;
        }

        [data-theme="dark"] .header::after {
            background: rgba(30, 30, 30, 0.7);
        }

        [data-theme="dark"] .card,
        [data-theme="dark"] .plan-stage,
        [data-theme="dark"] .poem-preview,
        [data-theme="dark"] .time-slot {
            background: rgba(45, 45, 45, 0.6);
        }

        @media (max-width: 768px) {
            .container {
                padding: 2rem 4%;
            }

            .title {
                font-size: 2.5rem;
            }

            .card {
                padding: 1.5rem;
            }

            .right-controls {
                top: 1rem;
                right: 1rem;
            }

            .control-item, .font-button {
                width: 48px;
                height: 48px;
            }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home-button">
      <i class="fas fa-home"></i>
    </a>
    <div class="floating-ink" style="left:10%;top:20%;font-size:60px">诗</div>
    <div class="floating-ink" style="right:15%;top:30%;font-size:50px">书</div>
    <div class="floating-ink" style="left:5%;bottom:15%;font-size:70px">画</div>
    <div class="floating-ink" style="right:10%;bottom:25%;font-size:40px">礼</div>

    <div class="right-controls">
        <div class="control-item theme-toggle" onclick="toggleTheme()">
            <i class="fas fa-moon theme-icon" id="theme-icon"></i>
        </div>
        <div class="font-controls">
            <div class="font-button" onclick="increaseFontSize()">
                <i class="fas fa-plus"></i>
            </div>
            <div class="font-button" onclick="decreaseFontSize()">
                <i class="fas fa-minus"></i>
            </div>
        </div>
    </div>

    <div class="container">
        <header class="header">
            <div class="title-wrapper">
                <h1 class="title">定制学习计划</h1>
                <p class="subtitle">工欲善其事，必先利其器</p>
            </div>
        </header>

        <div class="card">
            <h2 class="card-title"><i class="fas fa-book"></i> 选择诗词</h2>
            <div class="form-group">
                <label class="form-label">诗词标题</label>
                <div class="search-container">
                    <input type="text" class="form-control" id="poem-title" placeholder="输入诗词标题/作者/朝代关键字检索...">
                    <div class="search-results" id="poem-search-results"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title"><i class="fas fa-calendar-alt"></i> 学习时间设置</h2>
            <div class="form-group">
                <label class="form-label">目标完成日期</label>
                <input type="date" class="form-control" id="target-date">
            </div>

            <div class="form-group">
                <label class="form-label">可用学习时段</label>
                <div id="time-slots-container" class="time-slots">
                    <div class="time-slot">
                        <div class="form-group">
                            <label class="form-label">星期</label>
                            <select class="form-control day-select">
                                <option value="周一">周一</option>
                                <option value="周二">周二</option>
                                <option value="周三">周三</option>
                                <option value="周四">周四</option>
                                <option value="周五">周五</option>
                                <option value="周六">周六</option>
                                <option value="周日">周日</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">开始时间</label>
                            <input type="time" class="form-control start-time" value="19:00">
                        </div>
                        <div class="form-group">
                            <label class="form-label">结束时间</label>
                            <input type="time" class="form-control end-time" value="20:00">
                        </div>
                    </div>
                </div>
                <button type="button" class="btn btn-outline" id="add-time-slot">
                    <i class="fas fa-plus"></i> 添加时段
                </button>
            </div>

            <div class="form-group" style="margin-top: 2rem; text-align: center;">
                <button type="button" class="btn btn-primary" id="generate-plan">
                    <i class="fas fa-magic"></i> 生成学习计划
                </button>
            </div>
        </div>

        <div class="loading" id="loading-indicator">
            <div class="loading-spinner"></div>
            <p>正在为您生成个性化学习计划...</p>
        </div>

        <div class="plan-result" id="plan-result">
            <div class="result-header">
                <h2 class="card-title"><i class="fas fa-scroll"></i> 您的学习计划</h2>
                <button class="btn btn-outline" id="new-plan">
                    <i class="fas fa-redo"></i> 重新生成
                </button>
            </div>

            <div class="poem-preview">
                <span id="result-poem-title" style="font-weight: bold;"></span><br>
                <span id="result-poem-content"></span>
                <div style="margin-top: 1rem;">
                    <span>难度：<span id="result-difficulty"></span></span>
                    <span>预计总时长：<span id="result-total-time"></span> 分钟</span>
                </div>
            </div>

            <div id="schedule-container">
                <!-- 计划内容将在这里动态生成 -->
            </div>
        </div>
    </div>

    <script>
        // 全局存储所有诗词数据
        let allPoems = [];
        let currentFontSize = 100; // 字体大小百分比
        let activeResultIndex = -1; // 键盘选中的搜索结果索引
        let searchKeyword = ''; // 当前搜索关键字

        document.addEventListener('DOMContentLoaded', function() {
            // 加载所有诗词数据
            fetch('http://127.0.0.1:5000/api/poems')
                .then(response => response.json())
                .then(poems => {
                    allPoems = poems;
                    // 初始化第一首诗词预览（如果有）
                    if (poems.length > 0) {
                        loadPoemPreview(poems[0].title);
                    }
                })
                .catch(error => console.error('获取诗词列表失败:', error));

            // 绑定输入框检索事件
            const searchInput = document.getElementById('poem-title');
            const resultsContainer = document.getElementById('poem-search-results');

            // 输入事件 - 实时检索
            searchInput.addEventListener('input', function() {
                searchKeyword = this.value.trim();
                activeResultIndex = -1; // 重置选中索引

                // 无关键字时隐藏搜索结果
                if (searchKeyword.length < 1) {
                    resultsContainer.style.display = 'none';
                    return;
                }

                // 检索匹配的诗词（标题/作者/朝代包含关键字）
                const lowerKeyword = searchKeyword.toLowerCase();
                const matchedPoems = allPoems.filter(poem =>
                    poem.title.toLowerCase().includes(lowerKeyword) ||
                    poem.author.toLowerCase().includes(lowerKeyword) ||
                    poem.dynasty.toLowerCase().includes(lowerKeyword)
                );

                // 显示检索结果
                if (matchedPoems.length > 0) {
                    resultsContainer.innerHTML = '';
                    matchedPoems.forEach((poem, index) => {
                        const item = document.createElement('div');
                        item.className = 'result-item';
                        item.dataset.index = index;
                        item.dataset.title = poem.title;

                        // 关键字高亮处理
                        const highlightedTitle = highlightKeyword(poem.title, searchKeyword);
                        const highlightedAuthor = highlightKeyword(poem.author, searchKeyword);
                        const highlightedDynasty = highlightKeyword(poem.dynasty, searchKeyword);

                        // 拼接结果项HTML
                        item.innerHTML = `${highlightedTitle} - ${highlightedDynasty}·${highlightedAuthor}（${poem.grade}）`;

                        // 鼠标点击选择
                        item.addEventListener('click', () => {
                            selectPoem(poem.title, searchInput, resultsContainer);
                        });

                        // 鼠标悬停选中
                        item.addEventListener('mouseenter', () => {
                            activeResultIndex = index;
                            updateActiveResultClass(resultsContainer);
                        });

                        resultsContainer.appendChild(item);
                    });
                    resultsContainer.style.display = 'block';
                } else {
                    // 无匹配结果
                    resultsContainer.innerHTML = '<div class="result-item">未找到匹配的诗词</div>';
                    resultsContainer.style.display = 'block';
                }
            });

            // 键盘导航事件（上下键选择、回车确认、ESC关闭）
            searchInput.addEventListener('keydown', function(e) {
                const resultsContainer = document.getElementById('poem-search-results');
                const results = resultsContainer.querySelectorAll('.result-item');
                const resultCount = results.length;

                // 搜索结果未显示或无结果时不处理
                if (resultsContainer.style.display !== 'block' || resultCount === 0) {
                    return;
                }

                // 下箭头 - 选中下一个
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    activeResultIndex = (activeResultIndex + 1) % resultCount;
                    updateActiveResultClass(resultsContainer);
                    scrollToActiveResult(resultsContainer);
                }
                // 上箭头 - 选中上一个
                else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    activeResultIndex = (activeResultIndex - 1 + resultCount) % resultCount;
                    updateActiveResultClass(resultsContainer);
                    scrollToActiveResult(resultsContainer);
                }
                // 回车键 - 确认选择
                else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (activeResultIndex >= 0 && activeResultIndex < resultCount) {
                        const selectedTitle = results[activeResultIndex].dataset.title;
                        if (selectedTitle) {
                            selectPoem(selectedTitle, searchInput, resultsContainer);
                        }
                    }
                }
                // ESC键 - 关闭搜索结果
                else if (e.key === 'Escape') {
                    resultsContainer.style.display = 'none';
                    activeResultIndex = -1;
                }
            });

            // 点击页面其他地方关闭检索结果
            document.addEventListener('click', function(event) {
                const searchContainer = document.querySelector('.search-container');
                const resultsContainer = document.getElementById('poem-search-results');

                if (!searchContainer.contains(event.target)) {
                    resultsContainer.style.display = 'none';
                    activeResultIndex = -1;
                }
            });

            // 添加时段按钮事件
            document.getElementById('add-time-slot').addEventListener('click', function() {
                const container = document.getElementById('time-slots-container');
                const newSlot = document.createElement('div');
                newSlot.className = 'time-slot';
                newSlot.innerHTML = `
                    <div class="form-group">
                        <label class="form-label">星期</label>
                        <select class="form-control day-select">
                            <option value="周一">周一</option>
                            <option value="周二">周二</option>
                            <option value="周三">周三</option>
                            <option value="周四">周四</option>
                            <option value="周五">周五</option>
                            <option value="周六">周六</option>
                            <option value="周日">周日</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">开始时间</label>
                        <input type="time" class="form-control start-time" value="19:00">
                    </div>
                    <div class="form-group">
                        <label class="form-label">结束时间</label>
                        <input type="time" class="form-control end-time" value="20:00">
                    </div>
                    <button type="button" class="btn btn-outline remove-slot" style="padding: 0.5rem 1rem; margin-top: 0.5rem;">
                        <i class="fas fa-trash"></i> 移除
                    </button>
                `;
                container.appendChild(newSlot);

                // 绑定移除按钮事件
                newSlot.querySelector('.remove-slot').addEventListener('click', function() {
                    container.removeChild(newSlot);
                });
            });

            // 生成计划按钮事件
            document.getElementById('generate-plan').addEventListener('click', generateStudyPlan);

            // 重新生成按钮事件
            document.getElementById('new-plan').addEventListener('click', function() {
                document.getElementById('plan-result').style.display = 'none';
            });
        });

        // 关键字高亮处理函数
        function highlightKeyword(text, keyword) {
            if (!keyword || !text) return text;
            const regex = new RegExp(`(${keyword})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // 更新搜索结果选中样式
        function updateActiveResultClass(container) {
            const results = container.querySelectorAll('.result-item');
            results.forEach((item, index) => {
                if (index === activeResultIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // 滚动到选中的搜索结果
        function scrollToActiveResult(container) {
            const activeItem = container.querySelector(`.result-item[data-index="${activeResultIndex}"]`);
            if (activeItem) {
                activeItem.scrollIntoView({ block: 'nearest' });
            }
        }

        // 选择诗词处理函数
        function selectPoem(title, input, resultsContainer) {
            input.value = title;
            loadPoemPreview(title);
            resultsContainer.style.display = 'none';
            activeResultIndex = -1; // 重置选中索引
        }

        // 加载诗词预览
        function loadPoemPreview(title) {
            // 先从本地缓存获取，本地无则调用接口（可选）
            const poem = allPoems.find(p => p.title === title);
            if (poem) {
                document.getElementById('result-poem-title').textContent = poem.title;
                document.getElementById('result-poem-content').textContent = poem.content || '暂无诗词内容';
            } else {
                // 本地无数据时调用接口获取
                fetch(`http://127.0.0.1:5000/api/poems/search?keyword=${encodeURIComponent(title)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.length > 0) {
                            document.getElementById('result-poem-title').textContent = data[0].title;
                            document.getElementById('result-poem-content').textContent = data[0].content || '暂无诗词内容';
                        }
                    });
            }
        }

        // 生成学习计划
        function generateStudyPlan() {
            const poemTitle = document.getElementById('poem-title').value.trim();
            const targetDate = document.getElementById('target-date').value;

            // 收集时间槽数据
            const timeSlots = [];
            document.querySelectorAll('.time-slot').forEach(slot => {
                const day = slot.querySelector('.day-select').value;
                const start = slot.querySelector('.start-time').value;
                const end = slot.querySelector('.end-time').value;

                if (start && end) {
                    timeSlots.push({
                        "星期": day,
                        "开始": start,
                        "结束": end
                    });
                }
            });

            // 验证输入
            if (!poemTitle) {
                alert('请选择诗词');
                return;
            }

            if (timeSlots.length === 0) {
                alert('请至少添加一个学习时段');
                return;
            }

            // 显示加载状态
            document.getElementById('loading-indicator').style.display = 'block';

            // 发送请求生成计划
            fetch('http://127.0.0.1:5000/api/study-plan/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    user_id: 'student_1', // 实际应用中应使用真实用户ID
                    poem_title: poemTitle,
                    available_time: timeSlots,
                    target_date: targetDate
                })
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(data => {
                        throw new Error(data.error || '生成计划失败');
                    });
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('loading-indicator').style.display = 'none';

                if (data.plan) {
                    displayPlanResult(data.plan);
                }
            })
            .catch(error => {
                document.getElementById('loading-indicator').style.display = 'none';
                alert(error.message);
                console.error('生成计划失败:', error);
            });
        }

        // 显示计划结果
        function displayPlanResult(plan) {
            document.getElementById('result-poem-title').textContent = plan.poem_title;
            document.getElementById('result-poem-content').textContent = plan.content || '暂无诗词内容';
            document.getElementById('result-difficulty').textContent = plan.difficulty;
            document.getElementById('result-total-time').textContent = plan.required_time;

            // 生成阶段计划HTML
            const scheduleContainer = document.getElementById('schedule-container');
            scheduleContainer.innerHTML = '';

            plan.schedule.forEach((stage, index) => {
                const stageElement = document.createElement('div');
                stageElement.className = 'plan-stage';
                stageElement.innerHTML = `
                    <h4>第 ${stage.stage} 阶段</h4>
                    <div class="plan-meta">
                        日期：${stage.date} ${stage.time} · 时长：${stage.duration} 分钟
                    </div>
                    <div class="plan-task">${stage.task}</div>
                `;
                scheduleContainer.appendChild(stageElement);
            });

            // 显示结果
            document.getElementById('plan-result').style.display = 'block';
        }

        // 主题切换
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('theme-icon').className = isDark ? 'fas fa-moon' : 'fas fa-sun';
        }

        // 字体大小调整
        function increaseFontSize() {
            if (currentFontSize < 150) {
                currentFontSize += 10;
                document.body.style.fontSize = `${currentFontSize}%`;
            }
        }

        function decreaseFontSize() {
            if (currentFontSize > 70) {
                currentFontSize -= 10;
                document.body.style.fontSize = `${currentFontSize}%`;
            }
        }
    </script>
</body>
</html>

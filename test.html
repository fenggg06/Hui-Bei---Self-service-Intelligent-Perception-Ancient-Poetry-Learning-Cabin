<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>API测试</title></head>
<body>

<button onclick="loadPoems()">加载诗列表</button>
<button onclick="loadScores()">查 静夜思 历史</button>
<button onclick="addOne()">添加测试记录</button>

<pre id="out"></pre>

<script>
function log(obj){
  document.getElementById("out").innerText = JSON.stringify(obj,null,2);
}

async function loadPoems(){
  let r=await fetch("http://127.0.0.1:5000/api/poems");
  log(await r.json());
}

async function loadScores(){
  let r=await fetch("http://127.0.0.1:5000/api/scores?title=静夜思");
  log(await r.json());
}

async function addOne(){
  let fd=new FormData();
  fd.append("title","静夜思");
  fd.append("score","95");
  fd.append("feedback","好");
  let r=await fetch("http://127.0.0.1:5000/api/recite/add",{method:"POST",body:fd});
  log(await r.json());
}
</script>
</body>
</html>
